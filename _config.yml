# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------

title: Aldrich Halim
tagline: Software engineer in Brooklyn
description: >-
  Notes on networks, fintech engineering, and things I broke and then fixed.
author: Aldrich Halim
# User Pages site: repo is aldrichhalim/aldrichhalim.github.io, served at the
# domain root, so baseurl stays empty.
url: "https://aldrichhalim.github.io"
baseurl: ""

email: aldrichvhalim@gmail.com
github_username: aldrichhalim
linkedin_username: aldrichhalim
medium_username: aldrichhalim

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

permalink: /blog/:year/:month/:title/
timezone: America/New_York
lang: en

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/
  - README.md
  - CLAUDE.md
  - LICENSE

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page
